<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GT7 Datenbank | Racing Setup Hub</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .page{width:min(1200px,92vw);margin:auto;padding:24px 0 70px}
    .back{display:inline-block;margin-bottom:20px;color:#fff;text-decoration:none;padding:11px 15px;background:#101722;border:1px solid #243044;border-radius:12px}
    .hero{padding:30px;border-radius:22px;background:linear-gradient(135deg,#142b51,#101722);border:1px solid #243044;margin-bottom:22px}
    .hero h1{margin:8px 0;font-size:clamp(2rem,5vw,4rem)}
    .hero p{margin:0;color:#b7c2d1}
    .search{width:100%;padding:15px 16px;margin-bottom:18px;background:#101722;color:#fff;border:1px solid #243044;border-radius:14px}
    .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
    .filter-btn{padding:12px 16px;background:#101722;color:#fff;border:1px solid #243044;border-radius:12px;font-weight:800;cursor:pointer}
    .filter-btn.active{border-color:#ff2d2d;background:#192336}
    .layout{display:grid;grid-template-columns:240px 320px minmax(0,1fr);gap:18px}
    .panel{background:#101722;border:1px solid #243044;border-radius:18px;padding:18px}
    .panel h2{margin-top:0}
    .list{display:grid;gap:8px}
    .list-btn{width:100%;text-align:left;padding:12px;background:#0b111b;color:#fff;border:1px solid #26344a;border-radius:10px;cursor:pointer}
    .list-btn.active{border-color:#ff2d2d;background:#192336}
    .details-empty{color:#9ba8ba}
    .track-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
    .track-btn{padding:10px 12px;background:#0b111b;color:#fff;border:1px solid #26344a;border-radius:10px;cursor:pointer}
    .track-btn.active{border-color:#ff8a00}
    .setup-box{background:#0b111b;border-radius:14px;padding:16px;margin-top:14px}
    .setup-row{display:flex;justify-content:space-between;gap:20px;padding:9px 0;border-bottom:1px solid #202b3c}
    .setup-row:last-child{border-bottom:0}
    .note{width:100%;min-height:110px;margin-top:14px;padding:12px;color:#fff;background:#0b111b;border:1px solid #26344a;border-radius:12px;resize:vertical}
    .save{width:100%;margin-top:10px;padding:12px;background:linear-gradient(90deg,#ff2d2d,#ff8a00);color:#fff;border:0;border-radius:11px;font-weight:800;cursor:pointer}
    .status{min-height:18px;color:#79d99a}
    @media(max-width:900px){.layout{grid-template-columns:1fr}.panel{padding:15px}}
  </style>
</head>
<body>
  <main class="page">
    <a class="back" href="../index.html">← Zurück zum Dashboard</a>

    <section class="hero">
      <span class="badge">GT7 · NEUE STRUKTUR</span>
      <h1>Klasse → Hersteller → Fahrzeug → Strecke</h1>
      <p>Jedes Fahrzeug wird nur einmal angezeigt. Die Strecken wählst du innerhalb des Fahrzeugs aus.</p>
    </section>

    <input id="searchInput" class="search" type="search" placeholder="Fahrzeug, Hersteller oder Strecke suchen …">

    <section id="classFilters" class="filters"></section>

    <section class="layout">
      <aside class="panel">
        <h2>Hersteller</h2>
        <div id="manufacturerList" class="list"></div>
      </aside>

      <aside class="panel">
        <h2>Fahrzeuge</h2>
        <div id="carList" class="list"></div>
      </aside>

      <section class="panel">
        <div id="detailsEmpty" class="details-empty">Wähle links ein Fahrzeug aus.</div>

        <div id="details" hidden>
          <span id="carClass" class="badge"></span>
          <h2 id="carName"></h2>
          <p id="carManufacturer"></p>

          <h3>Strecke wählen</h3>
          <div id="trackTabs" class="track-tabs"></div>

          <div id="setupDetails" class="setup-box"></div>

          <textarea id="setupNote" class="note" placeholder="Eigene Notiz zu diesem Fahrzeug und dieser Strecke …"></textarea>
          <button id="saveNote" class="save">Notiz speichern</button>
          <p id="noteStatus" class="status"></p>
        </div>
      </section>
    </section>
  </main>

  <script src="../js/gt7.js"></script>
</body>
</html>
